# Reload conf by Ctrl + B, then write :source-file ~/.tmux.conf
set-option -g default-shell "/bin/zsh"

# Status
set -g status-interval 1
set -g status-left ''
set -g status-right ''
# set-option -g status-style bg=default

# set-window-option -g window-status-style fg='#333333',bg=default set-window-option -g window-status-current-style fg='#eeeeee',bg=default set -g status-justify centre set -g status-justify left Status end
set -g prefix C-b

set -g base-index 1
# set-option -g mouse on
# set -g set-clipboard on
set -g history-limit 100000

#  set -g default-terminal "xterm-256color"
# set -g terminal-overrides "xterm-256color"
# set -ga terminal-overrides "xterm-256color:Tc"
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Keybinds

# Movement and resize vim controls
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Rebind splits
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'

unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# Rebind rename to R
bind-key r command-prompt -I "#W" "rename-window '%%'"

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "mocha"
#set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
#
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
#
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
#
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Plugins
#set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'


#set -g @catppuccin_flavor 'mocha

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Tmux package manager
run '~/.tmux/plugins/tpm/tpm'
